name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core:
    name: Core + tests (sans le jeu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Build Core
        run: dotnet build Ultima.Core/Ultima.Core.csproj -c Release
      - name: Tests
        run: dotnet test Ultima.Tests/Ultima.Tests.csproj -c Release --logger "console;verbosity=normal"
      - name: Tests moteur (calcul pur, données commitées — porte budget, registre, statuts)
        run: dotnet test Ultima.Engine.Tests/Ultima.Engine.Tests.csproj -c Release --logger "console;verbosity=normal"
      - name: Tests saves (fixtures anonymisées ; tests de terrain ignorés sans le jeu)
        run: dotnet test Ultima.Saves.Tests/Ultima.Saves.Tests.csproj -c Release
